<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Urban Bites</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <h1>Urban Bites</h1>
            <p>The best burgers and pizzas in town</p>
            <button id="theme-toggle-btn">🌙</button>
        </header>

        <main>
            <div id="menu"></div>

            <section id="order">
                <h2>Your order</h2>

                <div id="order-items"></div>

                <div id="order-item-price">
                    <p>Total price:</p>
                    <p id="total-price">$0</p>
                </div>

                <button id="complete-order-btn">Complete order</button>
            </section>

            <section id="order-confirmation">
                <p></p>
            </section>
        </main>


        <div id="modal-overlay"></div>

        <form id="payment-modal">
            <button type="button" id="close-modal-btn">x</button>
            <h2>Enter card details</h2>
            <div class="payment-fields">
                <input id="payment-name" type="text" placeholder="Enter your name" 
                    aria-label="Enter your name" pattern=".*\S.*" required>
                <input id="payment-card-number" type="text" placeholder="Enter card number" 
                    aria-label="Enter card number" inputmode="numeric" pattern="[0-9]{13,19}"
                    maxlength="19" required>
                <input id="payment-cvv" type="text" placeholder="Enter CVV" 
                    aria-label="Enter CVV" inputmode="numeric" pattern="[0-9]{3,4}"
                    maxlength="4" required>
            </div>

            <button id="pay-btn">Pay</button>
        </form>
	<script src="index.js" type="module"></script>
    </body>
</html>
