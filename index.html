<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Smythe&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
       <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <h1>Jimmy's Diner</h1>
            <p>The best burgers and pizzas in town</p>
        </header>

        <main>
            <div id="menu"></div>

            <section id="order">
                <h2>Your order</h2>

                <div id="order-items">
                    <div class="order-item">
                        <div class="order-item-info">
                            <span class="order-item-name">Pizza</span>
                            <button class="remove-btn">remove</button>
                        </div>
                        <span class="price">$14</span>
                    </div>
                    <div class="order-item">
                        <div class="order-item-info">
                            <span class="order-item-name">Beer</span>
                            <button class="remove-btn">remove</button>
                        </div>
                        <span class="price">$12</span>
                    </div>
                </div>

                <div id="order-item-price">
                    <p>Total price:</p>
                    <p id="total-price">$26</p>
                </div>

                <button id="complete-order-btn">Complete order</button>
            </section>
        </main>
	<script src="index.js" type="module"></script>
    </body>
</html>
